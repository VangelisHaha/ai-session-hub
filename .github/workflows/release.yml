name: release

# 打 tag（v0.1.0）即发布：构建各平台二进制 -> 发布 npm 包 -> 上传 GitHub Release 附件。
# workflow_dispatch 只构建、不发布，可用来验证构建矩阵。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $cargo_version / tag: $tag_version"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 Cargo.toml 版本 $cargo_version 不一致"
            exit 1
          fi

  build:
    name: build ${{ matrix.npm_target }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 只用 arm 运行器：Apple clang 原生支持 -arch x86_64 交叉编译，
          # 不依赖已废弃的 macos-13 x64 运行器。
          - npm_target: darwin-arm64
            rust_target: aarch64-apple-darwin
            runner: macos-latest
          - npm_target: darwin-x64
            rust_target: x86_64-apple-darwin
            runner: macos-latest
          - npm_target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          # 公开仓库可用的免费 arm64 运行器；若该标签不可用，
          # 可改成 ubuntu-24.04-arm，或用 gcc-aarch64-linux-gnu 交叉编译。
          - npm_target: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.rust_target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.rust_target }}

      - name: Stage binary
        run: |
          mkdir -p "dist/${{ matrix.npm_target }}"
          cp "target/${{ matrix.rust_target }}/release/ash" "dist/${{ matrix.npm_target }}/ash"
          chmod +x "dist/${{ matrix.npm_target }}/ash"

      - name: Smoke test (native targets only)
        if: matrix.npm_target != 'darwin-x64'
        run: AI_SESSION_HUB_HOME="$(mktemp -d)" "dist/${{ matrix.npm_target }}/ash" stats

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm_target }}
          path: dist/${{ matrix.npm_target }}/ash
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish npm + release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # 上传 GitHub Release 附件
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble npm packages
        run: |
          chmod +x dist/*/ash
          node scripts/npm-prepare.mjs --input dist --output npm/build

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm/build/ai-session-hub-*; do
            echo "::group::npm publish $dir"
            npm publish "$dir" --access public --provenance
            echo "::endgroup::"
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish npm/build/ai-session-hub --access public --provenance

      - name: Pack binaries for the GitHub Release
        run: |
          mkdir -p release-assets
          for dir in dist/*/; do
            target="$(basename "$dir")"
            tar -czf "release-assets/ash-${GITHUB_REF_NAME}-${target}.tar.gz" -C "$dir" ash
          done
          (cd release-assets && sha256sum *.tar.gz > SHA256SUMS.txt)

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
