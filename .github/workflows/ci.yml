name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: Release build smoke test (unix)
        if: runner.os != 'Windows'
        run: |
          cargo build --release --locked
          AI_SESSION_HUB_HOME="$(mktemp -d)" ./target/release/ash stats

      - name: Release build smoke test (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked
          $env:AI_SESSION_HUB_HOME = Join-Path $env:RUNNER_TEMP "ash-index"
          .\target\release\ash.exe stats
          .\target\release\ash.exe sync --full
